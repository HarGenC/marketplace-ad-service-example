repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff check
        entry: uv run ruff check
        args: [--fix, --exit-non-zero-on-fix, src/, bin/]
        language: system
        types: [python]
        
      - id: ruff-format
        name: Ruff format
        entry: uv run ruff format
        args: [--check, src/, bin/]
        language: system
        types: [python]

  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: uv run pytest
        args: [-v, tests/]  # -v для подробного вывода
        language: system
        types: [python]
        pass_filenames: false  # Не передавать имена файлов, запускать все тесты
        always_run: true  # Запускать всегда, а не только при изменении Python файлов